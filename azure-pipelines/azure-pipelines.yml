trigger:
  branches:
    include:
      - main

variables:
  acrName: "energyacr"
  imageName: "energy-pipelines"
  imageTag: "$(Build.BuildId)"

stages:
  - stage: Infra
    displayName: "Terraform - provision datalake + AKS"
    jobs:
      - job: TerraformApply
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: "1.6.6"
          - script: |
              cd terraform/environments/prod
              terraform init -backend-config="storage_account_name=$(TF_BACKEND_STORAGE)" \
                              -backend-config="container_name=$(TF_BACKEND_CONTAINER)" \
                              -backend-config="key=energy-data-pipeline.tfstate"
              terraform plan -out=tfplan
              terraform apply -auto-approve tfplan
            displayName: "terraform init / plan / apply"
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

  - stage: Build
    displayName: "Build and push pipeline image"
    dependsOn: Infra
    jobs:
      - job: DockerBuildPush
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: Docker@2
            displayName: "Build and push energy-pipelines image"
            inputs:
              containerRegistry: "energyAcrServiceConnection"
              repository: "$(imageName)"
              command: "buildAndPush"
              Dockerfile: "pipelines/Dockerfile"
              buildContext: "pipelines"
              tags: |
                $(imageTag)
                latest

  - stage: RunMedallionPipeline
    displayName: "Run bronze -> silver -> gold on AKS"
    dependsOn: Build
    jobs:
      - job: RunJobs
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: Kubernetes@1
            displayName: "Apply bronze ingest CronJob"
            inputs:
              connectionType: "Kubernetes Service Connection"
              kubernetesServiceEndpoint: "aksEnergyEtlProd"
              namespace: "etl-medallion"
              command: "apply"
              arguments: "-f k8s/jobs/bronze-ingest-cronjob.yaml"
          - task: Kubernetes@1
            displayName: "Run silver transform job and wait"
            inputs:
              connectionType: "Kubernetes Service Connection"
              kubernetesServiceEndpoint: "aksEnergyEtlProd"
              namespace: "etl-medallion"
              command: "apply"
              arguments: "-f k8s/jobs/silver-transform-job.yaml"
          - script: |
              kubectl wait --for=condition=complete job/silver-transform-job -n etl-medallion --timeout=1800s
            displayName: "Wait for silver job completion"
          - task: Kubernetes@1
            displayName: "Run gold aggregate job"
            inputs:
              connectionType: "Kubernetes Service Connection"
              kubernetesServiceEndpoint: "aksEnergyEtlProd"
              namespace: "etl-medallion"
              command: "apply"
              arguments: "-f k8s/jobs/gold-aggregate-job.yaml"
          - script: |
              kubectl wait --for=condition=complete job/gold-aggregate-job -n etl-medallion --timeout=1800s
            displayName: "Wait for gold job completion"

  - stage: ScaleDown
    displayName: "Scale job node pool back to zero"
    dependsOn: RunMedallionPipeline
    jobs:
      - job: AksScaleDown
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: AzureCLI@2
            displayName: "az aks nodepool update --min-count 0"
            inputs:
              azureSubscription: "energyAzureServiceConnection"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                az aks nodepool update \
                  --resource-group rg-energy-data-platform-prod \
                  --cluster-name aks-energy-etl-prod \
                  --name jobs \
                  --update-cluster-autoscaler \
                  --min-count 0 \
                  --max-count 6
